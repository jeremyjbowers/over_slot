{% extends "auth/base_auth.html" %}

{% block auth_title %}Create your account{% endblock %}

{% block auth_content %}
<form method="post" action="{% url 'account_signup' %}" class="auth-form">
    {% csrf_token %}
    <div class="form-group">
        <label for="email" class="form-label">Email address</label>
        <input type="email" id="email" name="email" class="form-input" required>
    </div>
    
    <div class="form-group">
        <label for="password1" class="form-label">Password</label>
        <input type="password" id="password1" name="password1" class="form-input" required>
    </div>

    <div class="form-group">
        <label for="password2" class="form-label">Confirm password</label>
        <input type="password" id="password2" name="password2" class="form-input" required>
    </div>

    <button type="submit" class="form-submit">Create account</button>
</form>

<div class="auth-divider">
    <span>or</span>
</div>

<form method="post" action="{% url 'magic_link_signup' %}" class="auth-form">
    {% csrf_token %}
    <div class="form-group">
        <label for="magic_email" class="form-label">Email address</label>
        <input type="email" id="magic_email" name="email" class="form-input" required>
    </div>

    <button type="submit" class="form-submit">Sign up with magic link</button>
</form>

<div class="auth-links">
    <p>Already have an account? <a href="{% url 'account_login' %}">Sign in</a></p>
</div>
{% endblock %}

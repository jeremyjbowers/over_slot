{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <div class="auth-header">
            <h1 class="auth-title">{% block auth_title %}{% endblock %}</h1>
            {% if auth_subtitle %}
            <p class="auth-subtitle">{{ auth_subtitle }}</p>
            {% endif %}
        </div>
        
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="message {% if message.tags %}is-{{ message.tags }}{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        {% block auth_content %}{% endblock %}
    </div>
</div>

<style>
.auth-container {
    min-height: calc(100vh - 3.5rem);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
}

.auth-box {
    background: var(--dark-surface);
    border: 1px solid var(--dark-border);
    border-radius: 8px;
    padding: 2rem;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
}

.auth-header {
    text-align: center;
    margin-bottom: 2rem;
}

.auth-title {
    font-size: var(--text-2xl);
    font-weight: 700;
    color: var(--dark-text);
    margin-bottom: 0.5rem;
}

.auth-subtitle {
    color: var(--dark-text-secondary);
    font-size: var(--text-sm);
}

.auth-form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.form-label {
    font-size: var(--text-sm);
    font-weight: 500;
    color: var(--dark-text-secondary);
}

.form-input {
    padding: 0.75rem 1rem;
    background: var(--dark-bg);
    border: 1px solid var(--dark-border);
    border-radius: 6px;
    color: var(--dark-text);
    font-size: var(--text-base);
    width: 100%;
    transition: all 0.2s ease;
}

.form-input:focus {
    outline: none;
    border-color: var(--theme-primary);
    box-shadow: 0 0 0 2px rgba(var(--theme-primary-rgb), 0.1);
}

.form-submit {
    background: var(--theme-primary);
    color: var(--dark-text);
    border: none;
    border-radius: 6px;
    padding: 0.75rem 1rem;
    font-size: var(--text-base);
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-top: 0.5rem;
}

.form-submit:hover {
    filter: brightness(1.1);
}

.auth-divider {
    display: flex;
    align-items: center;
    text-align: center;
    margin: 1.5rem 0;
    color: var(--dark-text-secondary);
    font-size: var(--text-sm);
}

.auth-divider::before,
.auth-divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid var(--dark-border);
}

.auth-divider span {
    margin: 0 1rem;
}

.auth-links {
    margin-top: 1.5rem;
    text-align: center;
    font-size: var(--text-sm);
}

.auth-links a {
    color: var(--theme-primary);
    text-decoration: none;
}

.auth-links a:hover {
    text-decoration: underline;
}

.message {
    padding: 0.75rem 1rem;
    border-radius: 6px;
    margin-bottom: 1rem;
    font-size: var(--text-sm);
}

.message.is-success {
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid #10b981;
    color: #10b981;
}

.message.is-error {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid #ef4444;
    color: #ef4444;
}

.message.is-info {
    background: rgba(59, 130, 246, 0.1);
    border: 1px solid #3b82f6;
    color: #3b82f6;
}
</style>
{% endblock %}

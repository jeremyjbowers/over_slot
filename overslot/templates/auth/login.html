{% extends "auth/base_auth.html" %}

{% block auth_title %}Sign in to Over Slot{% endblock %}

{% block auth_content %}
<form method="post" action="{% url 'account_login' %}" class="auth-form">
    {% csrf_token %}
    <div class="form-group">
        <label for="email" class="form-label">Email address</label>
        <input type="email" id="email" name="email" class="form-input" required>
    </div>
    
    <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-input" required>
    </div>

    <button type="submit" class="form-submit">Sign in</button>
</form>

<div class="auth-divider">
    <span>or</span>
</div>

<form method="post" action="{% url 'magic_link' %}" class="auth-form">
    {% csrf_token %}
    <div class="form-group">
        <label for="magic_email" class="form-label">Email address</label>
        <input type="email" id="magic_email" name="email" class="form-input" required>
    </div>

    <button type="submit" class="form-submit">Send magic link</button>
</form>

<div class="auth-links">
    <p>Don't have an account? <a href="{% url 'account_signup' %}">Sign up</a></p>
    <p><a href="{% url 'account_reset_password' %}">Forgot your password?</a></p>
</div>
{% endblock %}

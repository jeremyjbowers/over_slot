<!DOCTYPE html>
<html lang="en" class="theme-red">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Over Slot{% endblock %}</title>
        
        <!-- Basic Meta Tags -->
        <meta name="description" content="{% block meta_description %}Over Slot - Comprehensive coverage of baseball's future stars, featuring prospect rankings, scouting reports, and in-depth analysis.{% endblock %}">
        
        <!-- Open Graph Meta Tags (Facebook, LinkedIn, etc.) -->
        <meta property="og:title" content="{% block og_title %}Over Slot - Baseball Prospect Rankings & Analysis{% endblock %}">
        <meta property="og:description" content="{% block og_description %}Over Slot - Comprehensive coverage of baseball's future stars, featuring prospect rankings, scouting reports, and in-depth analysis.{% endblock %}">
        <meta property="og:type" content="{% block og_type %}website{% endblock %}">
        <meta property="og:url" content="{% block og_url %}{{ request.build_absolute_uri }}{% endblock %}">
        <meta property="og:image" content="{% block og_image %}https://the-over-slot.nyc3.cdn.digitaloceanspaces.com/static/images/og-default.png{% endblock %}">
        <meta property="og:image:width" content="{% block og_image_width %}1200{% endblock %}">
        <meta property="og:image:height" content="{% block og_image_height %}630{% endblock %}">
        <meta property="og:site_name" content="Over Slot">
        
        <!-- Twitter Card Meta Tags -->
        <meta name="twitter:card" content="{% block twitter_card %}summary_large_image{% endblock %}">
        <meta name="twitter:title" content="{% block twitter_title %}Over Slot - Baseball Prospect Rankings & Analysis{% endblock %}">
        <meta name="twitter:description" content="{% block twitter_description %}Over Slot - Comprehensive coverage of baseball's future stars, featuring prospect rankings, scouting reports, and in-depth analysis.{% endblock %}">
        <meta name="twitter:image" content="{% block twitter_image %}https://the-over-slot.nyc3.cdn.digitaloceanspaces.com/static/images/og-default.png{% endblock %}">
        <meta name="twitter:image:alt" content="{% block twitter_image_alt %}Over Slot - Baseball prospect coverage{% endblock %}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
        <!-- Tailwind CSS (needed for subscription pages that use Tailwind utility classes) -->
        <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

        <!-- Favicons & App Icons -->
        <link rel="icon" type="image/x-icon" href="https://nyc3.digitaloceanspaces.com/the-over-slot/static/site_images/favicon/favicon.ico">
        <link rel="icon" type="image/png" sizes="32x32" href="https://nyc3.digitaloceanspaces.com/the-over-slot/static/site_images/favicon/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="https://nyc3.digitaloceanspaces.com/the-over-slot/static/site_images/favicon/favicon-16x16.png">
        <link rel="apple-touch-icon" sizes="180x180" href="https://nyc3.digitaloceanspaces.com/the-over-slot/static/site_images/favicon/apple-touch-icon.png">
        <link rel="icon" sizes="192x192" href="https://nyc3.digitaloceanspaces.com/the-over-slot/static/site_images/favicon/android-chrome-192x192.png">
        <link rel="icon" sizes="512x512" href="https://nyc3.digitaloceanspaces.com/the-over-slot/static/site_images/favicon/android-chrome-512x512.png">
        <link rel="manifest" href="https://nyc3.digitaloceanspaces.com/the-over-slot/static/site_images/favicon/site.webmanifest">
        <meta name="theme-color" content="#111111">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">        
        <style>
            :root {
                /* Theme Colors - Red theme only */
                --theme-red-primary: #ef4444;
                --theme-red-primary-rgb: 239, 68, 68;
                
                /* Set theme primary to red */
                --theme-primary: var(--theme-red-primary);
                --theme-primary-rgb: var(--theme-red-primary-rgb);
                --theme-primary-hover: #f87171; /* lighter red for hover */
                
                /* Dark Mode Colors */
                --dark-bg: #111111;
                --dark-surface: #1a1a1a;
                --dark-surface-hover: #222222;
                --dark-border: #333333;
                --dark-text: #ffffff;
                /* Improve contrast for secondary/muted text on dark background */
                --dark-text-secondary: #ffffff; /* was #e2e8f0 */
                --dark-text-muted: #ffffff;     /* was #cbd5e1 */
                
                /* Typography */
                --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen-Sans, Ubuntu, Cantarell, sans-serif;
                --font-serif: Georgia, Cambria, "Times New Roman", Times, serif;
                --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
                
                /* Font Sizes */
                --text-xs: 0.75rem;
                --text-sm: 0.875rem;
                --text-base: 1rem;
                --text-lg: 1.125rem;
                --text-xl: 1.25rem;
                --text-2xl: 1.5rem;
                --text-3xl: 1.875rem;
                --text-4xl: 2.25rem;
                --text-5xl: 3rem;
                
                /* Line Heights */
                --leading-none: 1;
                --leading-tight: 1.25;
                --leading-snug: 1.375;
                --leading-normal: 1.5;
                --leading-relaxed: 1.625;
                --leading-loose: 2;
            }

            /* Base Typography */
            body {
                font-family: var(--font-sans);
                background: var(--dark-bg);
                color: var(--dark-text);
                line-height: var(--leading-normal);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            /* Ensure strong/bold text is high-contrast on dark backgrounds */
            b, strong, .has-text-weight-bold, .is-bold {
                color: #ffffff;
            }

            main {
                flex: 1;
                padding-top: 3.5rem;
                padding-bottom: 4rem;
            }

            /* Headings */
            h1, h2, h3, h4, h5, h6,
            .title, .subtitle {
                font-family: var(--font-sans);
                letter-spacing: -0.02em;
                line-height: var(--leading-tight);
            }

            /* Article Typography */
            .article-body {
                font-family: var(--font-serif);
                font-size: var(--text-lg);
                line-height: var(--leading-relaxed);
                color: var(--dark-text-secondary);
            }

            .article-body h2 {
                font-family: var(--font-sans);
                font-size: var(--text-3xl);
                font-weight: 700;
                margin-top: 2.5em;
                margin-bottom: 0.8em;
                color: var(--dark-text);
            }

            .article-body h3 {
                font-family: var(--font-sans);
                font-size: var(--text-2xl);
                font-weight: 600;
                margin-top: 2em;
                margin-bottom: 0.8em;
                color: var(--dark-text);
            }

            /* Rich text: support all heading levels and text elements across editor content */
            .article-body h1,
            .scouting-report h1 {
                font-family: var(--font-sans);
                font-size: var(--text-4xl);
                font-weight: 800;
                margin-top: 2.5em;
                margin-bottom: 0.8em;
                color: var(--dark-text);
                letter-spacing: -0.02em;
                line-height: var(--leading-tight);
            }

            .scouting-report h2 {
                font-family: var(--font-sans);
                font-size: var(--text-3xl);
                font-weight: 700;
                margin-top: 2.25em;
                margin-bottom: 0.8em;
                color: var(--dark-text);
            }

            .scouting-report h3 {
                font-family: var(--font-sans);
                font-size: var(--text-2xl);
                font-weight: 600;
                margin-top: 2em;
                margin-bottom: 0.8em;
                color: var(--dark-text);
            }

            .article-body h4,
            .scouting-report h4 {
                font-family: var(--font-sans);
                font-size: var(--text-xl);
                font-weight: 600;
                margin-top: 1.75em;
                margin-bottom: 0.6em;
                color: var(--dark-text);
            }

            .article-body h5,
            .scouting-report h5 {
                font-family: var(--font-sans);
                font-size: var(--text-lg);
                font-weight: 600;
                margin-top: 1.5em;
                margin-bottom: 0.5em;
                color: var(--dark-text);
            }

            .article-body h6,
            .scouting-report h6 {
                font-family: var(--font-sans);
                font-size: var(--text-base);
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                margin-top: 1.25em;
                margin-bottom: 0.5em;
                color: var(--dark-text);
            }

            .scouting-report p { margin-bottom: 1.5em; }

            .article-body ul,
            .article-body ol,
            .scouting-report ul,
            .scouting-report ol {
                margin: 1.5em 0;
                padding-left: 1.5em;
            }

            .article-body li,
            .scouting-report li {
                margin-bottom: 0.5em;
            }

            .article-body blockquote,
            .scouting-report blockquote {
                font-style: italic;
                border-left: 3px solid var(--theme-primary);
                padding-left: 1.5em;
                margin: 2em 0;
                color: var(--dark-text);
            }

            .article-body hr,
            .scouting-report hr {
                border: 0;
                border-top: 1px solid var(--dark-border);
                margin: 2rem 0;
            }

            .article-body b,
            .article-body strong,
            .scouting-report b,
            .scouting-report strong { color: #ffffff; font-weight: 700; }

            .article-body em,
            .scouting-report em { font-style: italic; }

            .article-body u,
            .scouting-report u { text-decoration: underline; }

            .article-body s,
            .article-body del,
            .scouting-report s,
            .scouting-report del { text-decoration: line-through; }

            .article-body mark,
            .scouting-report mark {
                background: rgba(var(--theme-primary-rgb), 0.2);
                color: var(--dark-text);
                padding: 0 0.2em;
                border-radius: 0.2em;
            }

            .article-body sup,
            .article-body sub,
            .scouting-report sup,
            .scouting-report sub { font-size: 0.75em; }

            .article-body code,
            .scouting-report code {
                font-family: var(--font-mono);
                font-size: 0.95em;
                background: var(--dark-surface-hover);
                color: var(--dark-text);
                padding: 0.15em 0.35em;
                border: 1px solid var(--dark-border);
                border-radius: 4px;
            }

            .article-body pre,
            .scouting-report pre {
                background: var(--dark-surface);
                color: var(--dark-text);
                padding: 1rem;
                overflow: auto;
                border: 1px solid var(--dark-border);
                border-radius: 6px;
                line-height: var(--leading-relaxed);
            }

            .article-body pre code,
            .scouting-report pre code {
                background: transparent;
                border: none;
                padding: 0;
            }

            .article-body table,
            .scouting-report table {
                width: 100%;
                border-collapse: collapse;
                margin: 1.5rem 0;
                overflow: hidden;
                border: 1px solid var(--dark-border);
            }

            .article-body th,
            .article-body td,
            .scouting-report th,
            .scouting-report td {
                border: 1px solid var(--dark-border);
                padding: 0.625rem 0.75rem;
                text-align: left;
            }

            .article-body thead th,
            .scouting-report thead th {
                background: var(--dark-surface);
                color: var(--dark-text);
            }

            .article-body tbody tr:nth-child(odd),
            .scouting-report tbody tr:nth-child(odd) {
                background: rgba(255,255,255,0.02);
            }

            .article-body img,
            .scouting-report img {
                max-width: 100%;
                height: auto;
                display: block;
                margin: 1.5rem auto;
            }

            .article-body figure,
            .scouting-report figure {
                margin: 1.5rem 0;
                text-align: center;
            }

            .article-body figcaption,
            .scouting-report figcaption {
                font-size: var(--text-sm);
                color: var(--dark-text-muted);
                margin-top: 0.5rem;
            }

            /* Alignment helpers commonly emitted by editors */
            .article-body .text-left, .scouting-report .text-left { text-align: left; }
            .article-body .text-center, .scouting-report .text-center { text-align: center; }
            .article-body .text-right, .scouting-report .text-right { text-align: right; }

            /* Float helpers from Summernote */
            .article-body .note-float-left,
            .scouting-report .note-float-left { float: left; margin: 0 15px 15px 0; }
            .article-body .note-float-right,
            .scouting-report .note-float-right { float: right; margin: 0 0 15px 15px; }

            /* Ensure iframes scale */
            .article-body iframe,
            .scouting-report iframe { max-width: 100%; }

            @media screen and (max-width: 640px) {
                .article-body .note-float-left,
                .article-body .note-float-right,
                .scouting-report .note-float-left,
                .scouting-report .note-float-right {
                    float: none;
                    margin: 1rem 0;
                }
            }

            .article-body p {
                margin-bottom: 1.5em;
            }

            /* UI Elements */
            .meta-text {
                font-size: var(--text-sm);
                color: var(--dark-text-muted);
            }

            .hero-title {
                font-size: var(--text-5xl);
                font-weight: 800;
            }

            .hero-subtitle {
                font-size: var(--text-2xl);
                color: var(--dark-text-secondary);
                line-height: var(--leading-snug);
            }

            /* Code blocks */
            pre, code {
                font-family: var(--font-mono);
                font-size: var(--text-sm);
            }

            /* Links */
            a {
                color: var(--theme-primary);
                text-decoration: none;
                transition: color 0.2s ease;
            }

            a:hover {
                color: var(--theme-primary-hover);
                text-decoration: none;
            }

            /* Toggle Buttons (Read More/Show Less) */
            .toggle-button {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                background: none;
                border: none;
                color: var(--theme-primary);
                font-size: var(--text-sm);
                font-weight: 500;
                padding: 0.5rem 0;
                cursor: pointer;
            }

            .toggle-button:hover {
                color: var(--theme-primary-hover);
            }

            .toggle-button .icon {
                transition: transform 0.2s ease;
            }

            .toggle-button[aria-expanded="true"] .icon {
                transform: rotate(180deg);
            }

            .preview-content {
                position: relative;
                max-height: 150px;
                overflow: hidden;
            }

            .preview-content::after {
                content: '';
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                height: 50px;
                background: linear-gradient(transparent, var(--dark-surface));
                pointer-events: none;
            }

            .preview-content.expanded {
                max-height: none;
            }

            .preview-content.expanded::after {
                display: none;
            }

            /* --- Dark Theme overrides for Tailwind utility classes used in subscription pages --- */
            .bg-white,
            .bg-gray-50,
            .bg-blue-50,
            .bg-green-50,
            .bg-yellow-50 {
                background: var(--dark-surface) !important;
            }

            .text-gray-900,
            .text-blue-900,
            .text-green-900,
            .text-yellow-900 {
                color: var(--dark-text) !important;
            }

            .text-gray-800,
            .text-gray-700,
            .text-gray-600 {
                color: var(--dark-text-secondary) !important;
            }
            /* Global override: grey text classes are hard to read on dark theme */
            .has-text-grey,
            .has-text-grey-dark,
            .has-text-grey-darker,
            .has-text-grey-light,
            .has-text-grey-lighter {
                color: #ffffff !important;
            }

            .border-gray-200,
            .border-blue-200,
            .border-green-200,
            .border-yellow-200 {
                border-color: var(--dark-border) !important;
            }

            /* Buttons */
            .bg-blue-600 { background: #2563eb !important; }
            .hover\:bg-blue-700:hover { background: #1d4ed8 !important; }

            .bg-green-600 { background: #16a34a !important; }
            .hover\:bg-green-700:hover { background: #15803d !important; }

            .bg-red-600 { background: #dc2626 !important; }
            .hover\:bg-red-700:hover { background: #b91c1c !important; }

            .bg-yellow-50 { background: rgba(253, 224, 71, 0.08) !important; }
            .bg-green-50 { background: rgba(22, 163, 74, 0.08) !important; }
            .bg-blue-50 { background: rgba(59, 130, 246, 0.08) !important; }

            /* Improve contrast for green text labels */
            .text-green-800 { color: var(--dark-text) !important; }

            /* Reusable Chart Tabs Component */
            /* Override Bulma tabs styles completely for our custom pill-shaped tabs */
            .chart-tabs-wrapper {
                margin: 0.75rem 1rem 1.25rem;
            }
            .chart-tabs-wrapper .tabs {
                margin-bottom: 0 !important;
            }
            .chart-tabs-wrapper .tabs ul {
                display: flex !important;
                gap: 0.5rem !important;
                align-items: center !important;
                border-bottom: none !important;
            }
            .chart-tabs-wrapper .tabs li {
                margin: 0 !important;
                margin-bottom: 0 !important;
            }
            .chart-tabs-wrapper .tabs li a {
                display: inline-flex !important;
                align-items: center !important;
                gap: 0.35rem !important;
                padding: 0.4rem 0.85rem !important;
                border: 1px solid var(--dark-border) !important;
                border-radius: 999px !important;
                background: var(--dark-surface) !important;
                color: #ffffff !important;
                transition: all 0.15s ease !important;
                border-bottom: none !important;
                text-decoration: none !important;
            }
            .chart-tabs-wrapper .tabs li a:hover {
                background: var(--dark-surface-hover) !important;
                color: #ffffff !important;
                border-color: var(--dark-border) !important;
            }
            .chart-tabs-wrapper .tabs li.is-active a {
                border-color: var(--theme-primary) !important;
                background: var(--theme-primary) !important;
                color: #ffffff !important;
                font-weight: 700 !important;
            }
            .chart-tabs-wrapper .tabs .is-size-7 {
                color: #ffffff !important;
                opacity: 1 !important;
            }
            .chart-tabs-wrapper .tabs li a span {
                color: #ffffff !important;
            }
            .chart-tabs-wrapper .tabs .tab-level {
                color: #ffffff !important;
                opacity: 1 !important;
                font-weight: 700 !important;
            }
        </style>
        {% block extra_css %}{% endblock %}
    </head>
    <body>
        {% include "includes/nav.html" %}
        
        <main>
            {% block content %}{% endblock %}
        </main>

        {% block extra_js %}{% endblock %}
        <script>
        // Lightweight support for Twitter and YouTube embeds in rendered content
        document.addEventListener('DOMContentLoaded', function() {
            // Twitter/X embeds: load widgets.js if tweets are present
            if (document.querySelector('[data-twitter]') || document.querySelector('.twitter-tweet')) {
                var tw = document.createElement('script');
                tw.async = true;
                tw.src = 'https://platform.twitter.com/widgets.js';
                document.body.appendChild(tw);
            }
            // YouTube iframes are rendered natively; ensure responsive container if needed
            document.querySelectorAll('.article-body iframe[src*="youtube.com"], .article-body iframe[src*="youtu.be"]').forEach(function(iframe){
                iframe.style.maxWidth = '100%';
                iframe.style.height = iframe.style.height || '360px';
            });
        });
        </script>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-DXYDWXSQVP"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-DXYDWXSQVP');
        </script>
    </body>
</html>

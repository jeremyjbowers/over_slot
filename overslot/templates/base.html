<!DOCTYPE html>
<html lang="en" class="theme-red">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Over Slot{% endblock %}</title>
        
        <!-- Basic Meta Tags -->
        <meta name="description" content="{% block meta_description %}Over Slot - Comprehensive coverage of baseball's future stars, featuring prospect rankings, scouting reports, and in-depth analysis.{% endblock %}">
        
        <!-- Open Graph Meta Tags (Facebook, LinkedIn, etc.) -->
        <meta property="og:title" content="{% block og_title %}{% block title %}Over Slot{% endblock %}{% endblock %}">
        <meta property="og:description" content="{% block og_description %}{% block meta_description %}Over Slot - Comprehensive coverage of baseball's future stars, featuring prospect rankings, scouting reports, and in-depth analysis.{% endblock %}{% endblock %}">
        <meta property="og:type" content="{% block og_type %}website{% endblock %}">
        <meta property="og:url" content="{% block og_url %}{{ request.build_absolute_uri }}{% endblock %}">
        <meta property="og:image" content="{% block og_image %}{{ request.scheme }}://{{ request.get_host }}/static/images/og-default.png{% endblock %}">
        <meta property="og:image:width" content="{% block og_image_width %}1200{% endblock %}">
        <meta property="og:image:height" content="{% block og_image_height %}630{% endblock %}">
        <meta property="og:site_name" content="Over Slot">
        
        <!-- Twitter Card Meta Tags -->
        <meta name="twitter:card" content="{% block twitter_card %}summary_large_image{% endblock %}">
        <meta name="twitter:title" content="{% block twitter_title %}{% block og_title %}{% block title %}Over Slot{% endblock %}{% endblock %}{% endblock %}">
        <meta name="twitter:description" content="{% block twitter_description %}{% block og_description %}{% block meta_description %}Over Slot - Comprehensive coverage of baseball's future stars, featuring prospect rankings, scouting reports, and in-depth analysis.{% endblock %}{% endblock %}{% endblock %}">
        <meta name="twitter:image" content="{% block twitter_image %}{% block og_image %}{{ request.scheme }}://{{ request.get_host }}/static/images/og-default.png{% endblock %}{% endblock %}">
        <meta name="twitter:image:alt" content="{% block twitter_image_alt %}Over Slot - Baseball prospect coverage{% endblock %}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
        <!-- Tailwind CSS (needed for subscription pages that use Tailwind utility classes) -->
        <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Aleo:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">        
        <style>
            :root {
                /* Theme Colors - Red theme only */
                --theme-red-primary: #ef4444;
                --theme-red-primary-rgb: 239, 68, 68;
                
                /* Set theme primary to red */
                --theme-primary: var(--theme-red-primary);
                --theme-primary-rgb: var(--theme-red-primary-rgb);
                
                /* Dark Mode Colors */
                --dark-bg: #111111;
                --dark-surface: #1a1a1a;
                --dark-surface-hover: #222222;
                --dark-border: #333333;
                --dark-text: #ffffff;
                --dark-text-secondary: #94a3b8;
                --dark-text-muted: #64748b;
                
                /* Typography */
                --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen-Sans, Ubuntu, Cantarell, sans-serif;
                --font-serif: Georgia, Cambria, "Times New Roman", Times, serif;
                --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
                
                /* Font Sizes */
                --text-xs: 0.75rem;
                --text-sm: 0.875rem;
                --text-base: 1rem;
                --text-lg: 1.125rem;
                --text-xl: 1.25rem;
                --text-2xl: 1.5rem;
                --text-3xl: 1.875rem;
                --text-4xl: 2.25rem;
                --text-5xl: 3rem;
                
                /* Line Heights */
                --leading-none: 1;
                --leading-tight: 1.25;
                --leading-snug: 1.375;
                --leading-normal: 1.5;
                --leading-relaxed: 1.625;
                --leading-loose: 2;
            }

            /* Base Typography */
            body {
                font-family: var(--font-sans);
                background: var(--dark-bg);
                color: var(--dark-text);
                line-height: var(--leading-normal);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            main {
                flex: 1;
                padding-top: 3.5rem;
                padding-bottom: 4rem;
            }

            /* Headings */
            h1, h2, h3, h4, h5, h6,
            .title, .subtitle {
                font-family: var(--font-sans);
                letter-spacing: -0.02em;
                line-height: var(--leading-tight);
            }

            /* Article Typography */
            .article-body {
                font-family: var(--font-serif);
                font-size: var(--text-lg);
                line-height: var(--leading-relaxed);
                color: var(--dark-text-secondary);
            }

            .article-body h2 {
                font-family: var(--font-sans);
                font-size: var(--text-3xl);
                font-weight: 700;
                margin-top: 2.5em;
                margin-bottom: 0.8em;
                color: var(--dark-text);
            }

            .article-body h3 {
                font-family: var(--font-sans);
                font-size: var(--text-2xl);
                font-weight: 600;
                margin-top: 2em;
                margin-bottom: 0.8em;
                color: var(--dark-text);
            }

            .article-body p {
                margin-bottom: 1.5em;
            }

            /* UI Elements */
            .meta-text {
                font-size: var(--text-sm);
                color: var(--dark-text-muted);
            }

            .hero-title {
                font-size: var(--text-5xl);
                font-weight: 800;
            }

            .hero-subtitle {
                font-size: var(--text-2xl);
                color: var(--dark-text-secondary);
                line-height: var(--leading-snug);
            }

            /* Code blocks */
            pre, code {
                font-family: var(--font-mono);
                font-size: var(--text-sm);
            }

            /* Links */
            a {
                color: var(--theme-primary);
                text-decoration: none;
                transition: color 0.2s ease;
            }

            a:hover {
                color: var(--dark-text);
            }

            /* Toggle Buttons (Read More/Show Less) */
            .toggle-button {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                background: none;
                border: none;
                color: var(--theme-primary);
                font-size: var(--text-sm);
                font-weight: 500;
                padding: 0.5rem 0;
                cursor: pointer;
            }

            .toggle-button:hover {
                color: var(--theme-primary-hover);
            }

            .toggle-button .icon {
                transition: transform 0.2s ease;
            }

            .toggle-button[aria-expanded="true"] .icon {
                transform: rotate(180deg);
            }

            .preview-content {
                position: relative;
                max-height: 150px;
                overflow: hidden;
            }

            .preview-content::after {
                content: '';
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                height: 50px;
                background: linear-gradient(transparent, var(--dark-surface));
                pointer-events: none;
            }

            .preview-content.expanded {
                max-height: none;
            }

            .preview-content.expanded::after {
                display: none;
            }

            /* --- Dark Theme overrides for Tailwind utility classes used in subscription pages --- */
            .bg-white,
            .bg-gray-50,
            .bg-blue-50,
            .bg-green-50,
            .bg-yellow-50 {
                background: var(--dark-surface) !important;
            }

            .text-gray-900,
            .text-blue-900,
            .text-green-900,
            .text-yellow-900 {
                color: var(--dark-text) !important;
            }

            .text-gray-800,
            .text-gray-700,
            .text-gray-600 {
                color: var(--dark-text-secondary) !important;
            }

            .border-gray-200,
            .border-blue-200,
            .border-green-200,
            .border-yellow-200 {
                border-color: var(--dark-border) !important;
            }

            /* Buttons */
            .bg-blue-600 { background: #2563eb !important; }
            .hover\:bg-blue-700:hover { background: #1d4ed8 !important; }

            .bg-green-600 { background: #16a34a !important; }
            .hover\:bg-green-700:hover { background: #15803d !important; }

            .bg-red-600 { background: #dc2626 !important; }
            .hover\:bg-red-700:hover { background: #b91c1c !important; }

            .bg-yellow-50 { background: rgba(253, 224, 71, 0.08) !important; }
            .bg-green-50 { background: rgba(22, 163, 74, 0.08) !important; }
            .bg-blue-50 { background: rgba(59, 130, 246, 0.08) !important; }

            /* Improve contrast for green text labels */
            .text-green-800 { color: var(--dark-text) !important; }
        </style>
        {% block extra_css %}{% endblock %}
    </head>
    <body>
        {% include "includes/nav.html" %}
        
        <main>
            {% block content %}{% endblock %}
        </main>

        {% block extra_js %}{% endblock %}
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-DXYDWXSQVP"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-DXYDWXSQVP');
        </script>
    </body>
</html>
